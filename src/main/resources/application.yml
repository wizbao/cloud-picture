# 应用服务 WEB 访问端口
server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: cloud-picture-backend
  # 使用本地配置
  profiles:
    active: local
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://rm-cn-rap4ztia30002xuo.rwlb.cn-guangzhou.rds.aliyuncs.com:3306/cloud_picture?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: Wb123456!
  redis:
    database:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）



# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.wizbao.cloudpicture.controller

